name: Build & Publish Plugins

on:
    workflow_dispatch:
    push:
        branches: [master]

permissions:
    contents: write

jobs:
    build-and-publish:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Clone revenge-xposed
              run: |
                  git clone --depth 1 https://github.com/revenge-mod/revenge-xposed.git

            - name: Setup JDK 25
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "25"

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3
              with:
                  api-level: 36
                  build-tools: "37.0.0"
                  ndk-version: "r27c"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies & build plugin-cli
              run: |
                  bun install
                  cd node_modules/@revenge-mod/plugin-cli
                  bun run build

            - name: Cache Gradle
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                  restore-keys: |
                      gradle-${{ runner.os }}-

            - name: Cache Android SDK
              uses: actions/cache@v4
              with:
                  path: |
                      /opt/hostedtoolcache/android
                  key: android-sdk-${{ runner.os }}-36-37.0.0
                  restore-keys: |
                      android-sdk-${{ runner.os }}-

            - name: Publish revenge-api to Maven Local
              run: |
                  cd revenge-xposed
                  ./gradlew :api:publishToMavenLocal --no-daemon

            - name: Build all plugins
              run: |
                  ./gradlew packageAllPlugins --no-daemon

            - name: Generate repository index
              run: |
                  bunx revenge-plugin generate-index --dist build/dist --base-url "https://tralwdwd.github.io/revenge-next-plugins" --out build/dist/index.json

            - name: Verify dist artifacts
              run: |
                  ls -la build/dist/
                  echo "Artifacts ready for publishing"

            - name: Deploy to gh-pages branch
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./build/dist
                  destination_dir: .
                  keep_files: false
                  force_orphan: true
                  user_name: "github-actions[bot]"
                  user_email: "github-actions[bot]@users.noreply.github.com"
                  commit_message: "chore: publish plugin zips [skip ci]"
